[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easymagpie-codec-vllm"
version = "0.1.0"
description = "Native stateful EasyMagpie spectral codec model for vLLM"
requires-python = ">=3.10"
dependencies = []

[project.entry-points."vllm.general_plugins"]
easymagpie_codec = "vllm_plugin_easymagpie_codec:register"

[tool.setuptools.packages.find]
include = ["easymagpie_codec_vllm*", "vllm_plugin_easymagpie_codec*"]
