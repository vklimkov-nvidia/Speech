# EasyMagpie semantic backbone with four-stage acoustic MaskGIT refinement.
defaults:
  - easy_magpietts_lhotse
  - _self_

codecmodel_path: ???
phoneme_tokenizer_path: ???
train_input_cfg: ???
validation_input_cfg: ???
model:
  codecmodel_path: ${codecmodel_path}
  # The 13-codebook spectral semantic codec is split into one semantic codebook
  # predicted by the EasyMagpie backbone and 12 acoustic codebooks predicted below.
  num_audio_codebooks_train: 1
  frame_stacking_factor: 1
  cond_type: projection_semantic
  single_codebook_dim: 6
  codebook_dim: 78
  local_transformer_type: none
  # Useful for acoustic-refiner-only fine-tuning or environments without fused backbone backward kernels.
  freeze_backbone: false

  phoneme_tokenizer:
    tokenizer_path: ${phoneme_tokenizer_path}

  train_ds:
    dataset:
      input_cfg: ${train_input_cfg}

  validation_ds:
    dataset:
      input_cfg: ${validation_input_cfg}

  acoustic_decoder_hidden_dim: 512
  acoustic_decoder_transformer:
    _target_: nemo.collections.tts.modules.magpietts_modules.AcousticDecoderTransformer
    input_dim: ${model.hidden_dim}
    d_model: ${model.acoustic_decoder_hidden_dim}
    num_codebooks: 12
    codebook_size: 4096
    prediction_schedule: [1, 3, 4, 4]
    sampling_temperature: 0.0
    sampling_topk: null
    # The semantic backbone predicts EOS; zero-semantic variants override this to true.
    predict_eos: false

    semantic_layer:
      _target_: nemo.collections.tts.modules.acoustic_model_modules.AudioInputLayer
      input_dim: 6
      output_dim: ${model.acoustic_decoder_hidden_dim}
      audio_mask_min: 1.0
      audio_mask_max: 1.0

    transformer:
      _target_: nemo.collections.tts.modules.transformer_2501.Transformer
      n_layers: 3
      d_model: ${model.acoustic_decoder_hidden_dim}
      d_ffn: 2048
      sa_n_heads: 8
      kernel_size: 1
      p_dropout: 0.1
      p_dropout_out: 0.0
      has_xattn: false
      is_causal: true
      apply_norm_out: true
      max_length_causal_mask: 4096
      use_learnable_pos_emb: true
      ffn_type: swiglu
