# Stage 0 produces stacked acoustic codes; stage 1 decodes them to audio.
# Explicit routing is required because the talker reports model_type "nemotron_h".
pipeline: easymagpie

# Required for streaming code transfer between the two stages.
async_chunk: true

trust_remote_code: true
dtype: float16

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      # The causal decoder's measured receptive field is 0.854 s: 11 stacked
      # (80 ms) past frames. The 19-frame export therefore permits 8 new frames
      # per steady chunk. Start with 17 frames (1.36 s audio) to absorb scheduling
      # jitter; all decodes retain one fixed shape and trim context/right-padding.
      codec_chunk_frames: 8
      codec_left_context_frames: 11
      codec_startup_chunk_frames: [17]
      codec_fixed_chunk_frames: 19
      decode_cudagraph_capture_frames: [19]
      decode_cudagraph_batch_sizes: [1, 2, 4, 8, 16, 32]

stages:
  # Keep engine settings flat at the stage level; nested settings are not parsed.
  - stage_id: 0
    max_num_seqs: 32
    gpu_memory_utilization: 0.5
    enforce_eager: false
    async_scheduling: true
    enable_prefix_caching: false
    enable_chunked_prefill: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    mamba_ssm_cache_dtype: float32
    skip_tokenizer_init: true
    engine_extras:
      worker_cls: easymagpie_vllm_omni.runner.EasyMagpieGPUARWorker
    default_sampling_params:
      temperature: 0.0
      detokenize: false
      max_tokens: 2048

  - stage_id: 1
    max_num_seqs: 32
    gpu_memory_utilization: 0.35
    enforce_eager: true
    # Codec graph replays share static buffers and must not overlap.
    async_scheduling: false
    enable_prefix_caching: false
    # 32 sequences × 16 codebooks × 19 frames require at least 9728 tokens.
    max_num_batched_tokens: 10240
    max_model_len: 512
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      max_tokens: 65536
